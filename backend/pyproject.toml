[tool.ruff]
line-length = 100
target-version = "py312"
lint.select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
lint.ignore = ["B008"]  # allow dependency injection default args

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
